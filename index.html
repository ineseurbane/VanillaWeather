<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width>, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>Vanilla Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form>
          <input type="search" placeholder="Enter a city..." required />
          <input type="submit" value="search" />
        </form>
      </header>
      <main>
        <div>
          <h1>Riga</h1>
          <p>
            Sunday 13:16, sunny
            <br />
            Humidity: 52%, Wind: 5 km/h
          </p>
        </div>
        <div>☀️ 22°C</div>
      </main>
      <footer>
        This project was coded by
        <a href="https://github.com/ineseurbane" target="_blank">Inese Urbane</a
        >, code hosted on
        <a href="https://github.com/ineseurbane/VanillaWeather" target="_blank"
          >GitHub
        </a>
        and website hosted on
        <a
          href="https://vanilla-weatherapplication.netlify.app/"
          target="_blank"
          >Netlify</a
        >
      </footer>
    </div>
  </body>
</html>
